name: CI build

permissions:
  actions: read
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.check.outcome == 'success' && steps.check.outputs.should_skip == 'true' }}
    steps:
    - name: Check for a successful duplicate
      id: check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      # An API failure must fall back to running CI.
      continue-on-error: true
      with:
        # Only reuse completed successes; a running build could still fail or be cancelled.
        concurrent_skipping: 'never'
        skip_after_successful_duplicate: 'true'
        cancel_others: 'false'
        # Pushes must still produce artifacts for deployment/release jobs.
        do_not_skip: '["workflow_dispatch","schedule","merge_group","release","push"]'

  build:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      EMSCRIPTEN_VERSION: 5.0.4
    steps:
    - uses: actions/checkout@v6
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ runner.os }}-ccache-${{ env.EMSCRIPTEN_VERSION }}-debug
    - name: Emscripten cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/${{ github.run_id }}/emsdk-main
        key: ${{ runner.os }}-emsdk-${{ env.EMSCRIPTEN_VERSION }}-debug
    - name: Setup Emscripten toolchain
      uses: slowriot/setup-emsdk@v15
      with:
        version: ${{ env.EMSCRIPTEN_VERSION }}
    - name: Build
      run: ./build.sh

  build-rel:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pages: write
    env:
      EMSCRIPTEN_VERSION: 5.0.4
    steps:
    - uses: actions/checkout@v6
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ runner.os }}-ccache-${{ env.EMSCRIPTEN_VERSION }}-rel
    - name: Emscripten cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/${{ github.run_id }}/emsdk-main
        key: ${{ runner.os }}-emsdk-${{ env.EMSCRIPTEN_VERSION }}-rel
    - name: Setup Emscripten toolchain
      uses: slowriot/setup-emsdk@v15
      with:
        version: ${{ env.EMSCRIPTEN_VERSION }}
    - name: build-rel
      run: CMAKE_BUILD_TYPE=Release ./build.sh
    - name: Stage files for upload to GitHub Pages
      run: |
        mkdir deploy
        cp build_rel/client.* deploy/
        mv deploy/client.html deploy/index.html
    - name: Upload files for later stages
      uses: actions/upload-artifact@v7.0.1
      with:
        name: build-rel-artifacts
        path: ./deploy
    - name: Upload files to GitHub Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./deploy

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-rel
    permissions:
      pages: write  # Permissions needed to deploy to GitHub Pages
      id-token: write  # Permissions needed for OIDC authentication
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5

  build-electron-linux:
    runs-on: ubuntu-latest
    needs: build-rel
    steps:
    - uses: actions/checkout@v6
    - name: Setup Node toolchain
      uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Download artifacts from build-rel
      uses: actions/download-artifact@v8
      with:
        name: build-rel-artifacts
        path: ./deploy
    - name: Copy artifacts to Electron
      run: |
        mv deploy/* electron/webgpu-demo3/src/
    - name: Build
      run: |
        cd electron/webgpu-demo3
        npm install
        npm run make -- --platform linux
    # TODO: publish
    # TODO: cache node

  build-electron-win32:
    runs-on: windows-latest
    needs: build-rel
    steps:
    - uses: actions/checkout@v6
    - name: Setup Node toolchain
      uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Download artifacts from build-rel
      uses: actions/download-artifact@v8
      with:
        name: build-rel-artifacts
        path: ./deploy
    - name: Copy artifacts to Electron
      run: |
        Move-Item -Path "deploy\*" -Destination "electron\webgpu-demo3\src"
    - name: Build
      run: |
        cd electron\webgpu-demo3
        npm install
        npm run make -- --platform win32
    # TODO: publish
    # TODO: cache node

  build-electron-darwin:
    runs-on: macos-latest
    needs: build-rel
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Setup Node toolchain
      uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Download artifacts from build-rel
      uses: actions/download-artifact@v8
      with:
        name: build-rel-artifacts
        path: ./deploy
    - name: Copy artifacts to Electron
      run: |
        mv deploy/* electron/webgpu-demo3/src/
    - name: Build
      run: |
        cd electron/webgpu-demo3
        npm install
        npm run make -- --platform darwin --arch arm64
    - name: Upload macOS packages
      uses: actions/upload-artifact@v7.0.1
      with:
        name: electron-darwin-arm64
        path: electron/webgpu-demo3/out/make/
        if-no-files-found: error
    # Packages are unsigned and not notarised; intended for CI inspection, not public distribution.
    # TODO: cache node
